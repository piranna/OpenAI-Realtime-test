<!DOCTYPE html>
<html>

  <head>
    <meta charset="utf-8" />
    <title>OpenAI Realtime test</title>
    <meta name="description" content="OpenAI Realtime test" />
    <meta name="author" content="Jesús Leganés-Combarro 'piranna'" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/gh/yegor256/tacit@gh-pages/tacit-css.min.css" />
  </head>

  <body>
    <label for=autoGainControl>
      Automatic gain control
      <input id=autoGainControl type=checkbox checked>
    </label>
    <label for=echoCancellation>
      Echo cancellation
      <input id=echoCancellation type=checkbox checked>
    </label>
    <label for=noiseSuppression>
      Noise suppression
      <input id=noiseSuppression type=checkbox checked>
    </label>
    <label for="backgroundNoise">
      backgroundNoise
      <select id="backgroundNoise">
        <option value="">(None)</option>
        <optgroup label="Call center">
          <option
                  value="resources/audiojungle/16344272_call-center-office-ambience-loop_by_luishpms_preview.mp3">
            16344272_call-center-office-ambience-loop_by_luishpms_preview
          </option>
          <option
                  value="resources/freesound/Ambience - Busy office-call center.mp3">
            Ambience - Busy office-call center
          </option>
        </optgroup>
        <optgroup label="Coffee shop">
          <option
                  value="resources/pixabay/370973__waweee__coffee-shop-ambience_remasteredmp3-14437.mp3">
            370973__waweee__coffee-shop-ambience_remasteredmp3-14437
          </option>
          <option value="resources/pixabay/ambience-coffee-shop-1-49769.mp3">
            ambience-coffee-shop-1-49769
          </option>
        </optgroup>
      </select>
    </label>
    <button id="startStop" disabled>Start</button>
  </body>

  <script type="module" src="js/index.js"></script>

</html>
